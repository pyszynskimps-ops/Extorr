name: Clean old Actions artifacts
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page: 100});
            const cutoff = Date.now() - 86400000;
            for (const artifact of artifacts) {
              if (context.eventName === 'workflow_dispatch' || Date.parse(artifact.created_at) < cutoff) {
                await github.rest.actions.deleteArtifact({...context.repo, artifact_id: artifact.id});
                core.info('Deleted artifact ' + artifact.id);
              }
            }
